name: Build HAZmath

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-make:
    name: Legacy make build (in-tree install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gfortran liblapack-dev

      - name: make config && make install
        run: |
          make config shared=yes lapack=yes
          make install

      - name: Check in-tree install
        run: |
          test -f lib/libhazmath.so
          # the legacy install must not put headers or CMake files in the source tree
          test ! -d include/hazmath
          test ! -d lib/cmake

  legacy-swig:
    name: Legacy SWIG haznics module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran swig python3-dev python3-numpy

      - name: Build haznics
        run: |
          make config shared=yes haznics=yes
          make install
          test -f swig_files/_haznics.so

      # Known failure on main: include/hazmath.h (generated by haz_shutils/headmk.sh)
      # declares functions that only exist inside "#if 0" blocks, so the SWIG module
      # has unresolved symbols. Kept visible, but non-blocking, until that is fixed.
      - name: Import haznics
        continue-on-error: true
        working-directory: swig_files
        run: python3 -c "import haznics; print(haznics.AMG_param().max_levels)"

  cmake-install:
    name: CMake install (${{ matrix.os }}, shared=${{ matrix.shared }}, suitesparse=${{ matrix.suitesparse }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        shared: ["ON", "OFF"]
        suitesparse: ["ON", "OFF"]
        experimental: [false]
        include:
          - os: macos-latest
            shared: "ON"
            suitesparse: "OFF"
            experimental: true
    env:
      PREFIX: ${{ github.workspace }}/hazmath-install
    steps:
      - uses: actions/checkout@v7

      - name: Set Fortran compiler (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list gcc > /dev/null 2>&1 || brew install gcc
          echo "FC=$(ls $(brew --prefix)/bin/gfortran-* | head -n 1)" >> $GITHUB_ENV

      - uses: ./.github/actions/install-hazmath
        with:
          prefix: ${{ env.PREFIX }}
          shared: ${{ matrix.shared }}
          suitesparse: ${{ matrix.suitesparse }}

      - name: Check installed files
        run: |
          test -f $PREFIX/include/hazmath/hazmath.h
          test -f $PREFIX/include/hazmath/sparse.h
          find $PREFIX -name hazmathConfig.cmake | grep -q .
          find $PREFIX -name "libhazmath.*" | grep -q .

      - name: Build and run consumer project
        run: |
          cmake -S tests/cmake_consumer -B build-consumer -DCMAKE_PREFIX_PATH=$PREFIX
          cmake --build build-consumer
          ctest --test-dir build-consumer --output-on-failure

  sanitizers:
    name: ASan/UBSan consumer test
    runs-on: ubuntu-latest
    env:
      PREFIX: ${{ github.workspace }}/hazmath-install
      SAN_FLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-hazmath
        with:
          prefix: ${{ env.PREFIX }}
          build-type: Debug
          c-flags: ${{ env.SAN_FLAGS }}

      - name: Build and run consumer project with sanitizers
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          # linear_solver_amg (src/solver/itsolver.c) leaks the AMG_data array;
          # check memory errors only until that is fixed upstream
          ASAN_OPTIONS: detect_leaks=0
        run: |
          cmake -S tests/cmake_consumer -B build-consumer -DCMAKE_PREFIX_PATH=$PREFIX \
            -DCMAKE_C_FLAGS="$SAN_FLAGS"
          cmake --build build-consumer
          ctest --test-dir build-consumer --output-on-failure
