[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "haznicsx"
version = "0.1.0"
description = "HAZmath preconditioners for DOLFINx and PETSc"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "HAZmath developers" }]
dependencies = ["numpy"]

[project.urls]
repository = "https://github.com/HAZmathTeam/hazmath"

[project.optional-dependencies]
petsc = ["petsc4py"]
test = ["pytest", "scipy"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.21"
wheel.packages = ["src/haznicsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
